apiversion: modelslim_v1
spec:
  process:
  - type: quarot
    export_extra_info: true
  - type: flex_awq_ssz
    qconfig:
      act:
        scope: per_token
        dtype: int8
        symmetric: true
        method: minmax
      weight:
        scope: per_channel
        dtype: int4
        symmetric: true
        method: ssz
        ext:
          step: 10
    enable_subgraph_type:
    - up-down
    include:
    - '*'
    exclude:
    - model.layers.0.*
    - model.layers.1.*
    - model.layers.2.*
    - '*mlp.shared_experts.*'
  - type: flex_smooth_quant
    enable_subgraph_type:
    - norm-linear
    - ov
    - up-down
    include:
    - '*self_attn*'
    - model.layers.0.mlp.*
    - model.layers.1.mlp.*
    - model.layers.2.mlp.*
    - '*mlp.shared_experts.*'
    - '*input_layernorm*'
    exclude:
    - '*post_attention_layernorm*'
  - type: fa3_quant
    qconfig:
      dtype: int8
      scope: per_token
      symmetric: true
      method: minmax
    include:
    - '*indexer*'
    exclude:
    - model.layers.0.*
    - model.layers.1.*
    - model.layers.2.*
    - model.layers.70.*
    - model.layers.74.*
    - model.layers.78.*
  - type: fa3_quant
    qconfig:
      dtype: int8
      scope: per_token
      symmetric: true
      method: minmax
    include:
    - '*self_attn'
    exclude:
    - '*indexer*'
    - model.layers.0.*
    - model.layers.1.*
    - model.layers.2.*
    - model.layers.74.*
    - model.layers.75.*
    - model.layers.76.*
    - model.layers.77.*
    - model.layers.78.*
  - type: group
    configs:
    - type: linear_quant
      qconfig:
        act:
          scope: per_token
          dtype: int8
          symmetric: true
          method: minmax
        weight:
          scope: per_channel
          dtype: int8
          symmetric: true
          method: minmax
      include:
      - '*self_attn*'
      exclude:
      - '*kv_b_proj'
      - '*wk'
      - '*weights_proj'
    - type: linear_quant
      qconfig:
        act:
          scope: per_token
          dtype: int8
          symmetric: true
          method: minmax
        weight:
          scope: per_channel
          dtype: int8
          symmetric: true
          method: minmax
      include:
      - '*mlp*'
      exclude:
      - '*gate'
      - '*mlp.experts.*'
    - type: linear_quant
      qconfig:
        act:
          scope: per_token
          dtype: int8
          symmetric: true
          method: minmax
        weight:
          scope: per_channel
          dtype: int4
          symmetric: true
          method: ssz
      include:
      - '*mlp.experts.*'
  dataset: mix_calib.jsonl
  save:
  - type: ascendv1_saver
    part_file_size: 4
metadata:
  config_id: glm_5_2_w4a8c8
  score: 90.0
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: false
    kv_cache: true
  verified_model_types: []
  verified_tags:
    GLM-5.2:
    - - vLLM_Ascend
      - Atlas_A2_Inference
    - - vLLM_Ascend
      - Atlas_A3_Inference
default_w4a8_dynamic:
  act:
    scope: per_token
    dtype: int8
    symmetric: true
    method: minmax
  weight:
    scope: per_channel
    dtype: int4
    symmetric: true
    method: ssz
default_w8a8_dynamic:
  act:
    scope: per_token
    dtype: int8
    symmetric: true
    method: minmax
  weight:
    scope: per_channel
    dtype: int8
    symmetric: true
    method: minmax